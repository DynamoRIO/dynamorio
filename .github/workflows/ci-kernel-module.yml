# Github Actions workflow for building and testing the DynamoRIO Linux kernel module.

name: ci-kernel-module
on:
  # Run on pushes to master and on pull request changes, including from a
  # forked repo with no "push" trigger, while avoiding duplicate triggers.
  push:
    branches:
      - master
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:

jobs:
  build-only:
    name: build-only (${{ matrix.runner }}, debug=${{ matrix.debug }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        debug: ['ON', 'OFF']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y cmake doxygen g++ libelf-dev make vera++

      - name: Download and extract kernel source
        run: |
          VERSION="6.6.130"
          wget --quiet https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$VERSION.tar.xz
          tar -xf linux-$VERSION.tar.xz
          echo "KERNEL_DIR=linux-$VERSION" >> $GITHUB_ENV

      - name: Generate kernel headers
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          make defconfig
          make -j$(nproc) modules_prepare

      - name: Build DynamoRIO kernel module and controller
        run: |
          cmake -B build \
            -DBUILD_KERNEL_MODULE=ON \
            -DKERNEL_DIR=$GITHUB_WORKSPACE/$KERNEL_DIR \
            -DDEBUG=${{ matrix.debug }}
          cmake --build build --parallel $(nproc) --target dynamorio_module

  x86-64-insmod:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        debug: ['ON', 'OFF']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y cmake doxygen g++ libelf-dev make vera++ \
            linux-headers-$(uname -r)

      - name: Build DynamoRIO kernel module and controller against running kernel
        run: |
          cmake -B build -DBUILD_KERNEL_MODULE=ON -DDEBUG=${{ matrix.debug }}
          cmake --build build --parallel $(nproc) --target dynamorio_module

      - name: Load module, initialize session, and unload
        run: |
          MODULE=build/core/kernel_linux/dynamorio_module.ko
          CONTROLLER=build/bin64/drkernel_ctl

          # Start from a clean log so the checks below can't match stale
          # messages from a previous boot or run.
          sudo dmesg -C

          echo "Loading $MODULE"
          sudo insmod "$MODULE"
          sudo dmesg | grep -F "dynamorio_module: Module started"

          if [ "${{ matrix.debug }}" = "ON" ]; then
            sudo "$CONTROLLER" init "-loglevel 2"
            sudo dmesg | grep -F "DYNAMORIO_OPTIONS: -loglevel 2"
          else
            sudo "$CONTROLLER" init
          fi
          sudo dmesg | grep -F "dynamorio_module: Session initialized"

          echo "Removing dynamorio_module"
          sudo rmmod dynamorio_module
          sudo dmesg | grep -F "dynamorio_module: Module exited"

      - name: Dump dmesg log on failure
        if: failure()
        run: sudo dmesg
