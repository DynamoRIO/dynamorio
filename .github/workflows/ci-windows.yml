name: ci-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolate:
    name: Windows 8242 (${{ matrix.variant }})
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [original, mutex, sized]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Fetch comparison base
        run: git fetch --no-tags --depth=1 origin master
      - uses: ssciwr/doxygen-install@v1
        with:
          version: "1.14.0"
      - name: Prepare diagnostic variant
        run: python suite/windows_8242_diagnostic.py prepare ${{ matrix.variant }}
      - name: Build debug 64-bit suite
        shell: cmd
        run: |
          call "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvars32.bat"
          perl suite/runsuite_wrapper.pl automated_ci use_ninja 64_only debug_only build_only
        env:
          CI_TRIGGER: workflow_dispatch
          CI_BRANCH: ${{ github.ref }}
          DISABLE_FORMAT_CHECKS: 'true'
      - name: Run two offline tracing tests without retries
        run: python suite/windows_8242_diagnostic.py test
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-8242-${{ matrix.variant }}
          path: |
            windows-8242-test.log
            windows-8242-processes.log
            build_debug-internal-64/Testing/Temporary/
            build_debug-internal-64/suite/tests/8242-*.log
          retention-days: 7
